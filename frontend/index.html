  <script>
    const term = new Terminal({ convertEol: true });
    var Module = {
      print: function (message) {
        term.writeln(message);      //takes stuff printed by C and writes that to Xterm,js
      }
    };
    function updateSizeFromToggle() {
      const cb = document.querySelector('#accept');
      const cc = document.querySelector('#color');
      if (!cb.checked) {
        Module.ccall('get_size', null, ['number'], [40]);   //high resolution mode off
        term.options.fontSize = 16;
      } else {
        Module.ccall('get_size', null, ['number'], [150]);  //high resolution mode on
        term.options.fontSize = 5;
      }
      if (!cc.checked) {
        Module.ccall('color_set', null, ['number'], [0]); //Colour OFF
      } else {
        Module.ccall('color_set', null, ['number'], [1]); //Colour ON
      }
    }
    document.getElementById("Image-input").addEventListener("change", async (e) => {    // yup line 110-121 is mostly llm generated i am sorry :(
      const file = e.target.files[0];
      if (!file) return;
      term.clear();
      updateSizeFromToggle();
      const buffer = await file.arrayBuffer();
      const fileName = file.name;

      Module.FS.writeFile(fileName, new Uint8Array(buffer));
      Module.callMain([fileName]);

      const getWidth = Module.cwrap('image_width', 'number', []);
      const getHeight = Module.cwrap('image_height', 'number', []);
      term.resize(getWidth() + 10, getHeight() + 10);
    });
  </script> <!--- aha, coffeescript and jquery in 2026, please dont laugh at me :c --->
